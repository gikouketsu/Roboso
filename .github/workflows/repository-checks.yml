name: Repository checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax and local documentation links
        run: python tools/check_repository.py
      - name: Test offline packet inspection
        run: python -m unittest discover -s tests -v
